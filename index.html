<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17163a">
<title>הצילו את החומוס: משחק גיט</title>
<style>
:root{--bg:#17163a;--panel:#232255;--ink:#fff;--dim:#b4b3d8;--paper:#fff8e8;--paper-ink:#3b2f1e;
  --green:#3ddc84;--green-d:#1f9d5a;--red:#ff6b6b;--gold:#ffc83d;
  --wd:#ff9f43;--stage:#a66bff;--repo:#2ed8b6;--remote:#54a0ff;
  --mono:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f0e28}
body{color:var(--ink);font:16px/1.35 "Segoe UI","Noto Sans Hebrew","Arial Hebrew",Arial,system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate}
#app{height:100vh;height:100dvh;max-width:480px;margin:auto;background:var(--bg);display:flex;flex-direction:column;gap:7px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));overflow:hidden}

.top{display:flex;align-items:center;gap:8px;flex:none}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:9px;border-radius:9px;background:#ffffff22;overflow:hidden;display:block}
.segs b{display:block;height:100%;width:0;background:var(--gold);border-radius:9px;transition:width .3s}
.icon{width:34px;height:30px;border-radius:9px;background:#ffffff14;font-size:15px;flex:none}
.icon.lang{width:58px;font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap}

.bubble{flex:none;min-height:82px;background:var(--panel);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center}
.aha{font-size:14px;color:var(--green);min-height:0;animation:pop .25s}
.aha.bad{color:#ffb3b3}
.goal{font-size:18px;font-weight:800;line-height:1.25}

.stations{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;position:relative}
.st{--c:#fff;display:block;width:100%;background:var(--panel);border-radius:12px;border-bottom:4px solid var(--c);padding:5px 2px 4px;text-align:center;position:relative;cursor:default;transition:opacity .3s,filter .3s}
.st .e{font-size:27px;line-height:1.1;display:block}
.st .n{display:block;font-size:12.5px;font-weight:700;color:var(--c)}
.st .s{display:block;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.st.off{opacity:.35;filter:grayscale(1)}
.st.hit{animation:bump .45s}
.st.glow{animation:glow 1s infinite;cursor:pointer}
.st .pip{position:absolute;top:3px;inset-inline-end:5px;font-size:16px;animation:pop .25s}
@keyframes bump{40%{transform:scale(1.13)}}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--gold)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.place{flex:none;display:grid;grid-template-columns:3fr 1fr;gap:6px;font-size:11px;color:var(--dim);text-align:center;margin-bottom:-4px}

.paper{flex:1;min-height:64px;overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:6px 12px;position:relative;width:100%;display:block;text-align:start}
.phead{display:flex;justify-content:space-between;align-items:center;gap:6px;font:700 12px var(--mono);direction:ltr;color:#8a7a5c;margin-bottom:2px}
.pill{font:700 11px "Segoe UI",Arial,sans-serif;border-radius:9px;padding:0 7px;color:#fff;white-space:nowrap}
.l{font-size:17px;line-height:1.3;unicode-bidi:plaintext;text-align:start;min-height:1.3em}
.l.new{animation:newl .9s}
@keyframes newl{0%{background:#ffe08a;transform:scale(1.04)}100%{background:transparent}}
.l.add{background:#c9f5d6;color:#0b6b35;font-weight:700}
.l.del{background:#ffd9d6;color:#a3211a;text-decoration:line-through}
.l.mark{font:12px var(--mono);color:#b3261e;direction:ltr;text-align:left;unicode-bidi:isolate}
.l.ours{background:#dcebff}.l.theirs{background:#ffe7c7}
.l.log{font-size:14px;display:flex;gap:8px;unicode-bidi:normal}
.l.log b{font:700 12.5px var(--mono);color:#0c7a6d}
.burnt{display:flex;height:calc(100% - 4px);overflow:hidden;align-items:center;justify-content:center;font-size:44px;animation:bump .6s infinite}

.timeline{flex:none;height:104px;background:var(--panel);border-radius:12px;overflow:auto hidden;direction:ltr;position:relative}
.timeline svg{display:block}
.timeline .none{color:var(--dim);padding:40px 12px 0;font-size:14px;text-align:center}
.node{cursor:pointer}
.glowdot{animation:dot 1s infinite;transform-box:fill-box;transform-origin:center}
@keyframes dot{50%{transform:scale(1.5)}}

.strip{flex:none;height:30px;direction:ltr;background:#0b0b1e;border-radius:9px;padding:0 10px;display:flex;align-items:center;font:13px var(--mono);color:#ffe9a8;white-space:nowrap;overflow:hidden}
.strip::before{content:"$";color:var(--green);margin-right:8px}

.hand{flex:none;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:62px;gap:8px;min-height:132px}
.hand.free{grid-template-columns:1fr 1fr 1fr;grid-auto-rows:42px;min-height:142px}
.card{background:#fff;color:#1d1c45;border-radius:14px;border-bottom:5px solid #c9c8e6;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:2px 4px;animation:pop .22s;transition:transform .06s}
.card:active{transform:translateY(3px);border-bottom-width:2px}
.card code{font:700 15px var(--mono);direction:ltr}
.card span{font-size:13px;color:#5d5c8c}
.card.big{grid-column:1/-1;grid-row:span 2;background:var(--gold);border-bottom-color:#c98f00;font-size:22px;font-weight:800}
.card.hint{animation:hintp 1s infinite;background:#fff4c9}
.card.bad{animation:shake .4s;background:#ffd2d2}
.free .card code{font-size:12.5px}
.free .card{border-radius:10px;border-bottom-width:3px}
.wide2{grid-column:span 2}
@keyframes hintp{50%{box-shadow:0 0 0 4px var(--gold)}}
.point{grid-column:1/-1;grid-row:span 2;display:flex;align-items:center;justify-content:center;font-size:52px;animation:nudge 1s infinite}
@keyframes nudge{50%{transform:translateY(10px)}}
.options{display:contents}
.opt{grid-column:1/-1}
.hand.opts{grid-auto-rows:40px}
.hand.opts .card{border-bottom-width:4px;font-size:17px;font-weight:700}

.fly{position:fixed;z-index:15;padding:3px 10px;border-radius:9px;background:var(--gold);color:#222;font:700 13px var(--mono);pointer-events:none;box-shadow:0 4px 14px #0007;transition:transform .6s cubic-bezier(.3,.7,.3,1),opacity .15s .5s}

.overlay{position:fixed;inset:0;background:#0b0b1ecc;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.overlay.sheetwrap{align-items:flex-end;padding:0}
.dialog{background:var(--paper);color:#2b2540;border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:90dvh;overflow:auto;text-align:center;animation:pop .25s}
.dialog.sheet-up{border-radius:20px 20px 0 0;text-align:start}
.dialog.left{text-align:start}
.dialog h2{margin:0 0 6px;font-size:25px;line-height:1.2}
.dialog p{margin:6px 0;font-size:16px}
.big-e{font-size:60px;line-height:1.1}
.primary{display:block;width:100%;background:var(--green);border-bottom:5px solid var(--green-d);color:#06331a;border-radius:14px;padding:12px;font-size:19px;font-weight:800;margin-top:12px}
.primary:active{transform:translateY(3px);border-bottom-width:2px}
.ghost{display:block;width:100%;background:#0000000f;border-radius:12px;padding:9px;margin-top:8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.chips code{background:#1d1c45;color:#ffe9a8;border-radius:8px;padding:3px 9px;font:600 13.5px var(--mono);direction:ltr}
.row{padding:7px 0;border-bottom:1px solid #0000001a;text-align:start}
.row .p{font:700 13px var(--mono);direction:ltr;text-align:left;color:#0c7a6d}
.row .v{font:13px var(--mono);direction:ltr;text-align:left}
.row .w{font-size:14px;color:#5d5580}
.map{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:center;gap:2px;margin:10px 0;font-size:11px}
.map div{text-align:center}.map .i{font-size:25px;display:block}
.map code{font:700 10px var(--mono);color:#7231d6;display:block}
.stars{font-size:38px;letter-spacing:4px}
.term{display:flex;flex-direction:column;height:70dvh;background:#14171f;color:#d9dde6;border-radius:20px 20px 0 0;width:100%;max-width:480px;direction:ltr;font:13px/1.45 var(--mono);overflow:hidden}
.term .bar{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #2c313f;font:14px Arial,sans-serif}
#tout{flex:1;overflow:auto;padding:10px 12px;min-height:0}
#tout div{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.2em}
.t-cmd{color:#fff}.t-prompt{color:#7fd6a4}.t-g{color:#5ee08f}.t-r{color:#ff7b72}.t-y{color:#f2cc60}.t-c{color:#7cc4ff}.t-d{color:#8b91a0}
.t-tip{direction:rtl;text-align:right;color:#f5c86b;font-family:Arial,sans-serif}
html[dir=ltr] .t-tip{direction:ltr;text-align:left}
#tform{display:flex;gap:7px;align-items:center;padding:8px 12px;border-top:1px solid #2c313f}
#tform label{color:#7fd6a4;white-space:nowrap}
#tform input{flex:1;min-width:0;background:none;border:0;color:#fff;font:16px var(--mono);outline:none;direction:ltr}
#tform button{background:#2a7a4e;border-radius:6px;padding:3px 12px}
.toast{position:fixed;top:48px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:7px 14px;border-radius:9px;z-index:30;max-width:92vw;font-size:14px}
.editor textarea{width:100%;height:170px;font:16px/1.4 var(--mono);padding:8px;border:1px solid #ccc;border-radius:8px;unicode-bidi:plaintext;text-align:start}
.sheet{display:grid;grid-template-columns:1fr;gap:2px;text-align:start}
.sheet h3{margin:12px 0 3px;font-size:16px}
.sheet table{width:100%;border-collapse:collapse;font-size:14px}
.sheet td{padding:3px 0;vertical-align:top}
.sheet td:first-child{direction:ltr;text-align:left;font:12.5px var(--mono);color:#6f3d00;overflow-wrap:anywhere;width:52%;padding-inline-start:8px}
.note{font-size:14px;text-align:start;color:#5d5580}
.note li{margin-bottom:4px}
.note code,.dialog p code{font:12.5px var(--mono);direction:ltr;unicode-bidi:isolate}
@media (min-height:760px){.l{font-size:20px}}
@media (max-height:690px){
  .bubble{min-height:70px;padding:5px 10px}.goal{font-size:16px}.aha{font-size:13px}
  .st .e{font-size:21px}.st .s{display:none}.place{display:none}
  .timeline{height:88px}.hand{grid-auto-rows:50px;min-height:108px;gap:6px}.l{font-size:15px}
  .strip{height:25px}.hand.opts{grid-auto-rows:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="segs" id="segs"></div>
    <button class="icon lang" id="btnLang"></button>
    <button class="icon" id="btnTerm" aria-label="טרמינל">⌨️</button>
    <button class="icon" id="btnSheet" aria-label="דף פקודות">📋</button>
    <button class="icon" id="btnReset" aria-label="מההתחלה">↺</button>
  </div>
  <div class="strip" id="strip" aria-hidden="true"></div>
  <div class="bubble" aria-live="polite"><div class="aha" id="aha"></div><div class="goal" id="goal"></div></div>
  <div class="hand" id="hand"></div>
  <div class="place"><span>💻 על המחשב שלכם</span><span>☁️ בענן</span></div>
  <div class="stations">
    <div class="st" id="z-wd" style="--c:var(--wd)"></div>
    <div class="st" id="z-stage" style="--c:var(--stage)"></div>
    <button class="st" id="z-repo" style="--c:var(--repo)"></button>
    <div class="st" id="z-remote" style="--c:var(--remote)"></div>
  </div>
  <div class="paper" id="paper"></div>
  <div class="timeline" id="graph"></div>
</div>
<div class="overlay sheetwrap" id="termWrap" style="display:none">
  <div class="term">
    <div class="bar"><b>הטרמינל: מה שרץ באמת</b><button id="termClose" aria-label="סגירה">✕</button></div>
    <div id="tout" role="log"></div>
    <form id="tform" autocomplete="off" style="display:none">
      <label for="tinput" id="prompt"></label>
      <input id="tinput" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send">
      <button type="submit" aria-label="הרצה">▶</button>
    </form>
  </div>
</div>
<script>
'use strict';
/* ---------- language ---------- */
let lang = 'he';
const L = (he, en) => lang === 'en' ? en : he;
const T = s => lang === 'en' && s ? (EN[s.replace(/‎/g, '')] ?? s) : s;
const WORDS = { 'גרגירי חומוס': 'Chickpeas', 'קצת מלח': 'A little salt', 'הרבה מלח': 'Lots of salt', 'מלח': 'Salt', 'טחינה': 'Tahini', "צ'ילי": 'Chili', 'פפריקה': 'Paprika', 'כמון': 'Cumin', 'שום': 'Garlic', 'פטרוזיליה': 'Parsley', 'שמן זית': 'Olive oil', 'סודה לשתייה': 'Baking soda', 'קפה בכל מקום': 'coffee everywhere' };
const W = he => lang === 'en' ? WORDS[he] : he;
const EN = {
  // terminal tips
  'יש לכם שינויים שלא נשמרו, והמעבר היה דורס אותם. קודם commit (או git stash).': 'You have unsaved changes and this would overwrite them. Commit first (or git stash).',
  'התיקייה עוד לא פרויקט גיט. קודם: git init': 'This folder is not a Git project yet. First: git init',
  'פקודה לא מוכרת. הקלידו help לרשימה, או לחצו על הפקודה בצד.': 'Unknown command. Type help for the list.',
  'בסימולטור לא מאפשרים להוסיף קובץ עם סימני קונפליקט. גיט אמיתי כן יאפשר ויישמר זבל, אז תמיד לבדוק לפני add.': 'This simulator refuses a file with conflict markers. Real Git would accept it and save the mess, so always check before add.',
  'איזה קובץ? למשל git add hummus.txt, או git add . לכל מה שהשתנה.': 'Which file? For example git add hummus.txt, or git add . for everything that changed.',
  'יש קונפליקט פתוח: קודם מתקנים את הקובץ, אחר כך git add, ורק אז commit.': 'There is an open conflict: fix the file, then git add, and only then commit.',
  'חסרה הודעה. כך: git commit -m "מה עשיתי". (בלי -m גיט אמיתי פותח עורך טקסט.)': 'Missing a message. Like this: git commit -m "what I did". (Without -m, real Git opens a text editor.)',
  'אזור ההכנה ריק: commit שומר רק את מה שעבר git add. קודם git add.': 'The staging area is empty: commit saves only what went through git add. Run git add first.',
  'אין הבדלים. git diff משווה את הקובץ למה שכבר ב-staging; קבצים אחרי add רואים עם git diff --staged.': 'No differences. git diff compares the file with what is already staged; for files after add, use git diff --staged.',
  'אי אפשר למחוק את הענף שעומדים עליו. קודם git switch לענף אחר.': 'You cannot delete the branch you are on. First git switch to another one.',
  'אי אפשר ליצור ענף לפני ה-commit הראשון: ענף הוא תווית על commit.': 'You cannot create a branch before the first commit: a branch is a label on a commit.',
  'יש מיזוג באמצע. מסיימים אותו, או מבטלים עם git merge --abort.': 'A merge is in progress. Finish it, or cancel with git merge --abort.',
  'switch הוא לענפים. כדי לבקר ב-commit ישן: git checkout <hash>': 'switch is for branches. To visit an old commit: git checkout <hash>',
  'יש שינויים לא שמורים. קודם commit (או git stash), אחר כך ממזגים.': 'You have unsaved changes. Commit first (or git stash), then merge.',
  'עוד לא חיברתם שרת. קודם: git remote add origin <כתובת>': 'No server connected yet. First: git remote add origin <url>',
  'אין מה לדחוף: עוד אין commit בענף הזה.': 'Nothing to push: this branch has no commits yet.',
  'ב-GitHub יש commits שאין לכם. קודם git pull, אחר כך push.': 'GitHub has commits you do not have. git pull first, then push.',
  'דחיפה בכוח דורסת commits של אחרים ב-GitHub. כמעט אף פעם לא רוצים את זה.': "A force push overwrites other people's commits on GitHub. You almost never want this.",
  'reset --hard מוחק שינויים שלא נשמרו, בלי דרך חזרה. פקודה לזהירים.': 'reset --hard deletes unsaved changes with no way back. Handle with care.',
  'ביטול של commit מיזוג הוא מקרה מיוחד. נסו revert על commit רגיל.': 'Reverting a merge commit is a special case. Try revert on a regular commit.',
  'במחשב אמיתי clone מוריד את כל ה-.git מהשרת ופותח תיקייה חדשה עם הקבצים. בסימולטור יש רק תיקייה אחת, אז זו הדגמה בלבד.': 'On a real computer, clone downloads the whole .git from the server into a new folder with the files. This simulator has one folder, so this is only a demo.',
  'במחשב אמיתי זה נשמר ב-~/.gitconfig. כך גיט יודע איזה שם לכתוב על כל commit.': 'On a real computer this is saved in ~/.gitconfig. That is how Git knows which name to put on each commit.',
  'בסימולטור יש תיקייה אחת: hummus. במחשב אמיתי cd מחליף תיקייה.': 'This simulator has one folder: hummus. On a real computer, cd changes folder.',
  'מחיקת .git היתה מוחקת את כל ההיסטוריה ומשאירה רק את הקבצים. לא נעשה את זה פה.': 'Deleting .git would erase the whole history and leave only the files. Not doing that here.',
  'לא נוגעים ידנית בקבצים בתוך .git. גיט מנהל אותם לבד.': 'Do not edit files inside .git by hand. Git manages them.',
  'לא עורכים ידנית קבצים בתוך .git.': 'Do not edit files inside .git by hand.',
  'אולי התכוונתם ל-git?': 'Did you mean git?',
  'פקודה לא מוכרת. הקלידו help לרשימה.': 'Unknown command. Type help for the list.',
  'קודם דחפו את main ל-GitHub': 'Push main to GitHub first',
  // board
  'התיקייה': 'Folder', 'לא נשמר': 'unsaved', 'הקבצים': 'your files', 'הארגז': 'The box', 'אין עדיין': 'not yet', 'לא מחובר': 'not linked',
  'בלי גיט': 'no Git', 'קונפליקט': 'conflict', 'לא במעקב': 'untracked', 'שונה, לא נשמר': 'changed, unsaved', 'בארגז': 'in the box', 'שמור': 'saved',
  'ההיסטוריה נשרפה עם המחשב…': 'The history burned with the computer…', 'פה יופיעו השמירות שלכם': 'Your saves will appear here',
  '💻 על המחשב שלכם': '💻 On your computer', '☁️ בענן': '☁️ In the cloud', 'הטרמינל: מה שרץ באמת': 'Terminal: what really ran',
  // cards
  'להפעיל גיט': 'turn Git on', 'מה המצב?': "what's going on?", 'לשים בארגז': 'put in the box', 'לסגור ולשמור': 'seal and save', 'לשלוח לענן': 'send to the cloud',
  'להביא מהענן': 'get from the cloud', 'מה השתנה?': 'what changed?', 'כל השמירות': 'all saves', 'לבטל שינוי': 'undo a change', 'ענף חדש': 'new branch',
  'חזרה ל-main': 'back to main', 'לאחד ענפים': 'join branches', 'להוריד הכול': 'download it all', 'לחבר לשרת': 'link a server',
  // shared wrong answers

const $ = id => document.getElementById(id);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) e.append(c);
  return e;
}

/* ---------- the simulated repository ---------- */
const START_FILE = 'גרגירי חומוס\nמלח\n';
const FILE = 'hummus.txt';
let S, seq, anims, failed, ran, selected = null;

function freshState() {
  seq = 0;
  S = {
    init: false, files: { [FILE]: START_FILE }, index: {}, commits: {},
    branches: {}, head: { branch: 'main' }, remote: null, remoteRefs: {},
    tracking: {}, merging: null, stash: [],
  };
}

const lines = t => { if (!t) return []; const l = t.split('\n'); if (l[l.length - 1] === '') l.pop(); return l; };
const unlines = l => l.length ? l.join('\n') + '\n' : '';
const headId = () => S.head.detached || S.branches[S.head.branch] || null;
const tree = id => id ? S.commits[id].tree : {};
const headTree = () => tree(headId());
const headLabel = () => S.head.branch || S.head.detached.slice(0, 7);

function hash(s) {

  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16).padStart(8, '0').slice(0, 7);
}
function mkCommit(msg, parents, t, author = 'You') {
  const n = ++seq;
  const id = hash(n + msg + JSON.stringify(t) + parents.join());
  S.commits[id] = { id, n, msg, parents, tree: { ...t }, author, date: new Date() };
  return id;
}

  const seen = new Set(), st = id ? [id] : [];
  while (st.length) { const c = st.pop(); if (!seen.has(c)) { seen.add(c); st.push(...S.commits[c].parents); } }

}
const isAncestor = (a, b) => !!a && !!b && ancestors(b).has(a);
function mergeBase(a, b) {
  const A = ancestors(a); let best = null;
  for (const c of ancestors(b)) if (A.has(c) && (!best || S.commits[c].n > S.commits[best].n)) best = c;
  return best;
}
function setRef(id) { if (S.head.branch) S.branches[S.head.branch] = id; else S.head.detached = id; }

function ignored(path) {
  if (path === '.gitignore' || S.files['.gitignore'] === undefined) return false;
  return lines(S.files['.gitignore']).some(p => {
    p = p.trim(); if (!p || p[0] === '#') return false;

    .map(p => ({ p, kind: a[p] === undefined ? 'new file' : b[p] === undefined ? 'deleted' : 'modified' }));
}
function status() {

  const staged = treeDiff(headTree(), S.index).filter(d => !conflicts.includes(d.p));
  const unstaged = treeDiff(S.index, S.files).filter(d => S.index[d.p] !== undefined && !conflicts.includes(d.p));
  const untracked = Object.keys(S.files).filter(p => S.index[p] === undefined && !ignored(p) && !conflicts.includes(p)).sort();
  return { staged, unstaged, untracked, conflicts };

/* Line diff and three-way merge: enough diff3 that edits to different lines merge cleanly. */
function lcsPairs(a, b) {
  const t = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    t[i][j] = a[i] === b[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { out.push([i++, j++]); }
    else if (t[i + 1][j] >= t[i][j + 1]) i++; else j++;
  }
  return out;
}
function lineDiff(a, b) {
  const out = []; let i = 0, j = 0;
  for (const [x, y] of [...lcsPairs(a, b), [a.length, b.length]]) {
    while (i < x) out.push(['-', a[i++]]);
    while (j < y) out.push(['+', b[j++]]);
    if (x < a.length) out.push([' ', a[x]]);
    i = x + 1; j = y + 1;
  }
  return out;
}
function merge3Text(base, ours, theirs, oursName, theirsName) {
  const B = lines(base), O = lines(ours), T = lines(theirs);
  const mo = new Map(lcsPairs(B, O)), mt = new Map(lcsPairs(B, T));
  const out = []; let conflict = false, i = 0, j = 0, k = 0;
  const eq = (x, y) => x.join('\n') === y.join('\n');
  const chunk = (b, o, t) => {
    const cb = B.slice(i, b), co = O.slice(j, o), ct = T.slice(k, t);
    if (eq(co, cb)) out.push(...ct);
    else if (eq(ct, cb) || eq(co, ct)) out.push(...co);
    else { conflict = true; out.push('<<<<<<< ' + oursName, ...co, '=======', ...ct, '>>>>>>> ' + theirsName); }
  };
  for (let b = 0; b < B.length; b++) {
    if (mo.has(b) && mt.has(b)) {
      chunk(b, mo.get(b), mt.get(b));
      out.push(B[b]); i = b + 1; j = mo.get(b) + 1; k = mt.get(b) + 1;
    }
  }
  chunk(B.length, O.length, T.length);
  return { text: unlines(out), conflict };
}
function merge3Trees(base, ours, theirs, oursName, theirsName) {
  const res = {}, conflicts = [];
  for (const p of new Set([...Object.keys(base), ...Object.keys(ours), ...Object.keys(theirs)])) {
    const b = base[p], o = ours[p], t = theirs[p];
    if (o === t) { if (o !== undefined) res[p] = o; }
    else if (o === b) { if (t !== undefined) res[p] = t; }
    else if (t === b) { if (o !== undefined) res[p] = o; }
    else if (o === undefined || t === undefined) { res[p] = o ?? t; conflicts.push(p); }
    else {
      const m = merge3Text(b || '', o, t, oursName, theirsName);
      res[p] = m.text; if (m.conflict) conflicts.push(p);
    }
  }
  return { res, conflicts };
}
/* Replace the working files with a commit's tree, refusing like git when local edits would be lost. */
function checkoutTree(target) {

    err('error: Your local changes to the following files would be overwritten:');
    block.forEach(p => out('        ' + p, 'r'));
    err('Please commit your changes or stash them before you switch branches.');
    tip('יש לכם שינויים שלא נשמרו, והמעבר היה דורס אותם. קודם commit (או git stash).');
    return false;
  }
  for (const p of changed) {
    if (target[p] === undefined) { delete S.files[p]; delete S.index[p]; }
    else { S.files[p] = target[p]; S.index[p] = target[p]; }

}
function resolveRev(r) {
  if (!r) return null;
  const m = r.match(/^(.*?)(~(\d*)|\^)$/);
  if (m) {
    let id = resolveRev(m[1]);
    const n = m[2] === '^' ? 1 : m[3] === '' ? 1 : +m[3];
    for (let i = 0; i < n && id; i++) id = S.commits[id].parents[0] || null;
    return id;
  }
  if (r === 'HEAD') return headId();
  if (S.branches[r]) return S.branches[r];
  if (S.remoteRefs[r]) return S.remoteRefs[r];
  if (/^[0-9a-f]{4,}$/.test(r)) {
    const vis = visibleCommits().find(c => c.id.startsWith(r.slice(0, 7)) && r.startsWith(c.id.slice(0, r.length)));

    if (id) ancestors(id).forEach(c => ids.add(c));

}

    el('div', { class: 'big-e' }, L.e), el('h2', {}, tr(`עברתם את "${L.name}"!`, `You beat "${T(L.name)}"!`)), t, chips,
    el('button', { class: 'primary', onclick: go }, tr(`הלאה ל"${next.name}" ${next.e}`, `On to "${T(next.name)}" ${next.e}`))));
  document.body.append(ov);
}
function showFinish() {
  const stars = mistakes <= 2 ? 3 : mistakes <= 7 ? 2 : 1;
  const rank = ['', 'מתלמד גיט', 'שף של גיט', 'מאסטר גיט'][stars];
  const close = () => ov.remove();
  const ar = L('←', '→');
  const mapHtml = `<div><span class="i">📝</span>${T('התיקייה')}</div><div><code>add</code>${ar}</div>
    <div><span class="i">📦</span>${T('הארגז')}</div><div><code>commit</code>${ar}</div>
    <div><span class="i">🗄️</span><span class="ltr">.git</span></div><div><code>push</code>${ar}</div>
    <div><span class="i">☁️</span>GitHub</div>`;
  const ov = el('div', { class: 'overlay' }, el('div', { class: 'dialog' },
    el('div', { class: 'stars' }, '⭐'.repeat(stars)),

    el('div', { class: 'map', html: mapHtml }),
    el('button', { class: 'primary', onclick: () => { close(); enterFree(); } }, T('משחק חופשי')),
    el('button', { class: 'ghost', onclick: openSheet }, T('📋 דף פקודות')),
    el('button', { class: 'ghost', onclick: () => { close(); start(); } }, T('לשחק שוב'))));
  document.body.append(ov);
}
const INGR = ['כמון', 'שום', 'פטרוזיליה', 'שמן זית'];
function enterFree() {
  free = true; lv = LEVELS.length; si = 0;
  LEVELS.length && renderSegsDone();
  $('tform').style.display = '';
  setBubble('', 'משחק חופשי: נסו מה שבא לכם');
  const h = $('hand'); h.textContent = ''; h.className = 'hand free';
  const cmd = (label, line) => el('button', { class: 'card', onclick: () => freeRun(line()) }, el('code', {}, label));
  h.append(
    el('button', { class: 'card', onclick: () => { editFile(t => t + W(INGR[freeN++ % INGR.length]) + '\n'); } }, T('🥣 מרכיב')),
    cmd('add', () => 'git add .'), cmd('commit', () => `git commit -m "save ${++freeN}"`),
    cmd('status', () => 'git status'), cmd('log', () => 'git log --oneline'), cmd('diff', () => 'git diff'),
    cmd('push', () => 'git push'), cmd('pull', () => 'git pull'),
    el('button', { class: 'card', onclick: freePlayFriend }, T('🤝 חבר דוחף')),
  );
  render();
  $('paper').onclick = () => openEditor(FILE);
}
function renderSegsDone() { $('segs').querySelectorAll('b').forEach(b => b.style.width = '100%'); }
function freeRun(line) {
  typed(line); runLine(line);
  const last = $('tout').lastElementChild;
  setBubble(failed && last ? last.textContent.replace('💡 ', '') : '', failed ? 'משחק חופשי' : 'משחק חופשי: ⌨️ מציג פלט מלא', failed);
}
function openSheet() {
  const table = (title, rows) => {
    const t = el('div'); t.append(el('h3', { html: T(title) }));
    const tb = el('table');
    rows.forEach(([c, d]) => {
      const tr = el('tr'); const a = el('td'); a.textContent = T(c); const b = el('td'); b.textContent = T(d);
      tr.append(a, b); tb.append(tr);
    });
    t.append(tb); return t;
  };
  const sheet = el('div', { class: 'sheet' },
    table('מתחילים', [['git init', 'פרויקט חדש בתיקייה הזו'], ['git clone <url>', 'הורדת פרויקט קיים'], ['git config --global user.name "..."', 'השם שלכם (פעם אחת)'], ['git config --global user.email "..."', 'המייל שלכם (פעם אחת)']]),
    table('כל יום', [['git status', 'מה המצב'], ['git add <file>', 'לאזור ההכנה'], ['git add .', 'כל מה שהשתנה'], ['git commit -m "..."', 'שמירה'], ['git log --oneline', 'היסטוריה'], ['git diff', 'מה השתנה ועוד לא ב-add'], ['git diff --staged', 'מה ב-add ועוד לא נשמר']]),
    table('ענפים', [['git branch', 'רשימת ענפים'], ['git switch -c <name>', 'ענף חדש, ועוברים אליו'], ['git switch <name>', 'מעבר לענף'], ['git merge <name>', 'מיזוג לענף הנוכחי'], ['git branch -d <name>', 'מחיקת ענף שמוזג']]),
    table('עם אחרים', [['git remote add origin <url>', 'חיבור לשרת'], ['git push -u origin main', 'דחיפה ראשונה'], ['git push', 'שליחת commits'], ['git pull', 'הורדה ומיזוג'], ['git fetch', 'הורדה בלי מיזוג']]),
    table('ביטולים', [['git restore <file>', 'ביטול שינוי שלא נשמר (נמחק!)'], ['git restore --staged <file>', 'הוצאה מאזור ההכנה'], ['git revert <hash>', 'commit חדש שמבטל ישן (בטוח)'], ['git stash / git stash pop', 'החבאת שינויים לרגע, והחזרה'], ['git reset --hard <hash>', 'מחיקת עבודה וחזרה אחורה (מסוכן!)']]),
    table('איפה הכול נמצא', [['קבצים', 'תיקיית העבודה'], ['staging', '\u200E.git/index'], ['commits', '\u200E.git/objects'], ['ענפים', '\u200E.git/refs/heads'], ['איפה אני', '\u200E.git/HEAD'], ['כתובת השרת', '\u200E.git/config']]),
  );
  const notes = el('div', { html: L(`
    <h3>מה שונה במחשב אמיתי</h3>
    <ul class="note">
      <li>מתקינים מ-<code>git-scm.com</code>, ובפעם הראשונה מגדירים שם ומייל. בלי זה commit ייכשל.</li>
      <li>הענף הראשוני עשוי להיקרא <code>master</code>. <code>git init -b main</code> קובע <code>main</code>.</li>
      <li>לפני push צריך ליצור את הפרויקט באתר GitHub ולהתחבר. הסיסמה הרגילה לא עובדת שם: משתמשים ב-<code>gh auth login</code> או מפתח SSH.</li>
      <li>אם <code>git pull</code> מבקש לבחור איך למזג: <code>git config pull.rebase false</code> מתנהג כמו פה.</li>
      <li>קובץ <code>.gitignore</code> מונה מה לא לשמור בגיט. <b>סיסמאות ומפתחות לא נכנסים לגיט לעולם</b>: גם אחרי מחיקה הם נשארים בהיסטוריה.</li>
    </ul>`, `
    <h3>What is different on a real computer</h3>
    <ul class="note">
      <li>Install from <code>git-scm.com</code>, and set your name and email the first time. Without them, commit fails.</li>
      <li>The first branch may be called <code>master</code>. <code>git init -b main</code> sets it to <code>main</code>.</li>
      <li>Before pushing, create the project on GitHub and sign in. Your regular password does not work there: use <code>gh auth login</code> or an SSH key.</li>
      <li>If <code>git pull</code> asks how to merge: <code>git config pull.rebase false</code> behaves like this game.</li>
      <li>A <code>.gitignore</code> file lists what not to save in Git. <b>Passwords and keys never go into Git</b>: even after deleting them, they stay in the history.</li>
    </ul>`) });
  const close = () => ov.remove();
  const ov = el('div', { class: 'overlay', onclick: e => { if (e.target === ov) close(); }, onkeydown: e => { if (e.key === 'Escape') close(); } },
    el('div', { class: 'dialog left' }, el('h2', { html: T('דף פקודות') }), sheet, notes,
      el('button', { class: 'primary', onclick: close }, T('סגירה')),
      el('button', { class: 'ghost', onclick: () => print() }, T('הדפסה'))));
  document.body.append(ov);
  ov.querySelector('.primary').focus();
}

/* ---------- wiring ---------- */
$('tform').addEventListener('submit', e => {
  e.preventDefault();
  const i = $('tinput'), line = i.value.trim();
  i.value = '';
  if (line) { hist.push(line); histI = hist.length; runLine(line); }
});
$('btnTerm').onclick = () => { $('termWrap').style.display = ''; $('tout').scrollTop = $('tout').scrollHeight; };
$('termClose').onclick = () => { $('termWrap').style.display = 'none'; };
$('btnSheet').onclick = openSheet;
$('btnReset').onclick = () => { if (confirm(T('להתחיל מחדש?'))) start(); };
function start() {
  freshState(); if (lang === 'en') convertState(WORDS); ran = new Set(); anims = []; failed = false;
  lv = 0; si = 0; mistakes = 0; free = false; freeN = 0; extraI = 0; burned = false; diffOn = logOn = false;
  prevLines = new Set(); friendA = friendB = null;
  $('tout').textContent = ''; $('strip').textContent = ''; $('tform').style.display = 'none'; $('paper').onclick = null;
  enter('');
}
function showIntro() {
  const ov = el('div', { class: 'overlay' }, el('div', { class: 'dialog' },
    el('div', { class: 'big-e' }, '🧆'), el('h2', {}, T('הצילו את החומוס')),
    el('p', {}, T('גיט הוא Save Game לקבצים. לוחצים על קלפים, רואים מה קורה, ובסוף יודעים גיט.')),
    el('button', { class: 'primary', onclick: () => ov.remove() }, T('יאללה')),
    el('button', { class: 'ghost', id: 'introLang', onclick: () => { setLang(lang === 'en' ? 'he' : 'en'); ov.remove(); showIntro(); } }, L('🌐 Play in English', '🌐 לשחק בעברית'))));
  document.body.append(ov);
}
/* The recipe is real file content, so switching language rewrites it everywhere, history included. */
function convertState(map) {
  const keys = Object.keys(map).sort((a, b) => b.length - a.length);
  const conv = t => { let out = ''; for (let i = 0; i < t.length;) { const k = keys.find(k => t.startsWith(k, i)); if (k) { out += map[k]; i += k.length; } else out += t[i++]; } return out; };
  const tree = o => { for (const p of Object.keys(o)) if (typeof o[p] === 'string') o[p] = conv(o[p]); };
  tree(S.files); tree(S.index);
  Object.values(S.commits).forEach(c => tree(c.tree));
  S.stash.forEach(e => tree(e.files));
}
function applyLang() {
  const h = document.documentElement;
  h.lang = lang; h.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.title = L('הצילו את החומוס: משחק גיט', 'Save the hummus: a Git game');
  const pl = document.querySelectorAll('.place span');
  pl[0].textContent = T('💻 על המחשב שלכם'); pl[1].textContent = T('☁️ בענן');
  document.querySelector('.term .bar').dir = h.dir;
  document.querySelector('.term .bar b').textContent = T('הטרמינל: מה שרץ באמת');
  $('btnLang').textContent = L('🌐 EN', '🌐 עב');
  $('btnLang').setAttribute('aria-label', L('English', 'עברית'));
  $('btnTerm').setAttribute('aria-label', L('טרמינל', 'Terminal'));
  $('btnSheet').setAttribute('aria-label', T('דף פקודות'));
  $('btnReset').setAttribute('aria-label', L('מההתחלה', 'Start over'));
}
function setLang(next) {
  if (next === lang) return;
  const back = Object.fromEntries(Object.entries(WORDS).map(([he, en]) => [en, he]));
  convertState(next === 'en' ? WORDS : back);
  lang = next;
  try { localStorage.setItem('git-game-lang', lang); } catch (e) {}
  prevLines = new Set();
  applyLang();
  render();
  if (free) enterFree();
  else {
    setBubble(bubbleRaw[0], bubbleRaw[1]);
    if (!busy) { renderHand(); if (curStep()?.dot) renderTimeline(); }
  }
}
$('btnLang').onclick = () => setLang(lang === 'en' ? 'he' : 'en');
try { lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('git-game-lang') || 'he'; } catch (e) {}
if (lang !== 'en') lang = 'he';
applyLang();
start();
showIntro();
</script>
