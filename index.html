<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גיט ב-5 דקות</title>
<style>
:root{
  --bg:#f6f2ea;--card:#fffdf9;--ink:#20242e;--dim:#6b6f7b;--line:#e2dccf;
  --wd:#bf5408;--stage:#7231d6;--repo:#0c7a6d;--remote:#1b55d0;
  --term:#14171f;--term-ink:#d9dde6;--ok:#127a3e;
  --mono:ui-monospace,"Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI","Noto Sans Hebrew","Arial Hebrew",Arial,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--remote);outline-offset:2px}
code{font-family:var(--mono);font-size:.9em;background:#ece6d8;padding:1px 5px;border-radius:4px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}

.app{height:100vh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;min-height:620px}
header{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--ink);color:#fff}
header h1{font-size:17px;margin:0;white-space:nowrap}
.progress{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.bar{flex:1;height:8px;background:#ffffff2e;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#f5b53f;transition:width .35s}
.where{font-size:13px;color:#cfd3dc;white-space:nowrap}
.hbtn{background:none;border:1px solid #ffffff55;color:#fff;border-radius:6px;padding:3px 10px;font-size:13px;white-space:nowrap}
.hbtn:hover{background:#ffffff1c}

.main{display:grid;grid-template-columns:350px minmax(0,1fr);min-height:0}
.mission{background:var(--card);border-inline-end:1px solid var(--line);padding:16px 18px;overflow:auto}
.chapter{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.02em}
.mission h2{font-size:19px;line-height:1.3;margin:2px 0 8px}
.mission p{margin:0 0 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.action{background:#fff3df;border:1px solid #e3b878;border-radius:8px;padding:6px 12px;color:#6f3d00;font-weight:600}
.action:hover:not(:disabled){background:#ffe8c4}
.action:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.chip{display:block;width:100%;direction:ltr;text-align:left;background:var(--term);color:#ffe9a8;border:0;border-radius:7px;padding:8px 11px;font:13.5px var(--mono);overflow-wrap:anywhere}
.chip:hover{background:#262b38}
.chiphint{font-size:12.5px;color:var(--dim);margin:-4px 0 8px}
.linkbtn{background:none;border:0;padding:0;color:var(--remote);text-decoration:underline;font-size:14px}
.done{background:#e8f6ec;border:1px solid #a9dcb9;border-radius:9px;padding:10px 12px;margin-top:12px;animation:rise .3s ease}
.done b:first-child{color:var(--ok)}
.next{margin-top:10px;width:100%;background:var(--ok);color:#fff;border:0;border-radius:8px;padding:9px;font-weight:700}
.next:hover{background:#0e6532}
.kbd{font-size:12px;color:var(--dim);text-align:center;margin-top:5px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.work{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px 12px;min-width:0;min-height:0}
.scopes{display:grid;grid-template-columns:minmax(0,3fr) 46px minmax(0,1fr);font-size:12px;font-weight:700;color:var(--dim);margin-bottom:3px;text-align:center}
.scopes span{border-bottom:2px solid #cfc7b4;padding-bottom:1px}
.scopes span:last-child{grid-column:3}
.zones{display:grid;grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr) 46px minmax(0,1fr) 46px minmax(0,1fr)}
.zone{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:9px;padding:7px 9px;height:172px;overflow:auto;transition:box-shadow .25s}
.zone.focus{box-shadow:0 0 0 2px var(--c)}
.zone.hit{animation:hit .5s}
@keyframes hit{40%{background:color-mix(in srgb,var(--c) 16%,white)}}
.zone h3{margin:0;font-size:14px;color:var(--c)}
.zone .sub{font-size:11.5px;color:var(--dim);line-height:1.3;margin-bottom:5px}
.empty{font-size:12px;color:var(--dim);font-style:italic}
.arrows{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;font:11px var(--mono);color:var(--dim)}
.arrows div{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.arrows b{font-size:17px;font-weight:400;color:var(--ink)}
.file{display:block;width:100%;text-align:start;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 7px;margin-bottom:5px}
button.file:hover{border-color:var(--wd)}
.fname{display:flex;justify-content:space-between;align-items:center;gap:5px;font:12px var(--mono);direction:ltr}
.fname span:first-child{overflow:hidden;text-overflow:ellipsis}
.badge{font:700 10px var(--mono);border-radius:4px;padding:0 4px;color:#fff;white-space:nowrap}
.b-U{background:#b3261e}.b-M{background:#b86e00}.b-C{background:#b3261e}.b-ok{background:var(--repo)}.b-A{background:var(--stage)}.b-D{background:#555}.b-I{background:#888}
.fbody{unicode-bidi:plaintext;text-align:start;margin:2px 0 0;font:11.5px/1.32 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:#444}
.repoinfo{font-size:12.5px}
.hash{font-family:var(--mono);color:var(--repo);font-weight:700}
.friend{margin-top:6px;font-size:12px;background:#e9efff;border:1px solid #b4c6f5;color:#173d96;border-radius:6px;padding:2px 7px}

.bottom{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;min-height:0}
.term{background:var(--term);color:var(--term-ink);border-radius:10px;display:flex;flex-direction:column;min-height:0;direction:ltr;font:13px/1.45 var(--mono)}
.tout{flex:1;overflow:auto;padding:10px 12px;min-height:0}
.tout div{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.2em}
.t-cmd{color:#fff}.t-prompt{color:#7fd6a4}
.t-g{color:#5ee08f}.t-r{color:#ff7b72}.t-y{color:#f2cc60}.t-c{color:#7cc4ff}.t-d{color:#8b91a0}
.t-tip{direction:rtl;text-align:right;color:#f5c86b;font-family:"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;font-size:13px}
.tin{display:flex;align-items:center;gap:7px;padding:8px 12px;border-top:1px solid #2c313f}
.tin label{color:#7fd6a4;white-space:nowrap}
.tin input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;outline:none;direction:ltr}
.tin button{background:#2a7a4e;border:0;border-radius:6px;color:#fff;padding:2px 11px;font-size:14px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:6px;font-size:13px;color:var(--dim);border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--repo)}
.pbody{flex:1;overflow:auto;min-height:0;padding:8px 10px}
#graph{direction:ltr;overflow-x:auto}
#graph svg{display:block}
.node{cursor:pointer}
.detail{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;font-size:12.5px}
.detail pre{margin:3px 0 0;font:11.5px/1.35 var(--mono);white-space:pre-wrap;background:#f3eee3;padding:5px 7px;border-radius:5px;direction:rtl;text-align:right}
.gitrow{padding:4px 0;border-bottom:1px solid #eee7d9;font-size:12.5px}
.gitrow:last-child{border-bottom:0}
.gitrow .p{font:600 12px var(--mono);direction:ltr;text-align:left;color:var(--repo)}
.gitrow .v{font:11.5px var(--mono);direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;color:#333}
.gitrow .w{color:var(--dim);font-size:12px}

.overlay{position:fixed;inset:0;background:#14171fb8;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--card);border-radius:14px;padding:22px 26px;max-width:600px;width:100%;max-height:92vh;overflow:auto}
.dialog.wide{max-width:820px}
.dialog h2{margin:0 0 8px;font-size:25px;line-height:1.2}
.dialog h3{margin:14px 0 4px;font-size:15px}
.dialog ul{margin:6px 0;padding-inline-start:20px}
.dialog li{margin-bottom:5px}
.primary{background:var(--ok);color:#fff;border:0;border-radius:9px;padding:10px 24px;font-weight:700;font-size:16px;margin-top:10px}
.primary:hover{background:#0e6532}
.ghost{background:none;border:1px solid var(--line);border-radius:9px;padding:8px 16px;margin-top:10px;margin-inline-start:8px}
.note{font-size:13px;color:var(--dim)}
.editor textarea{width:100%;height:190px;font:14px/1.45 var(--mono);padding:8px;border:1px solid var(--line);border-radius:7px;unicode-bidi:plaintext;text-align:start}
.sheet{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.sheet table{border-collapse:collapse;width:100%;font-size:13px}
.sheet td{padding:2px 0;vertical-align:top}
.sheet td:first-child{direction:ltr;text-align:left;padding-inline-start:10px;white-space:nowrap;font:12.5px var(--mono);color:#6f3d00}
.q{margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.q p{margin:0 0 5px;font-weight:600}
.q button{display:block;width:100%;text-align:start;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 9px;margin-bottom:4px;font-size:13.5px}
.q button:hover:not(:disabled){border-color:var(--remote)}
.q button.right{background:#e0f4e6;border-color:#6dc08a}
.q button.wrong{background:#fde7e5;border-color:#e69a94}
.q button:disabled{cursor:default;color:inherit}
.q .why{font-size:13px;color:var(--dim);margin-top:3px}

.fly{position:fixed;z-index:15;padding:2px 9px;border-radius:6px;color:#fff;font:600 12px var(--mono);pointer-events:none;box-shadow:0 3px 10px #0005;transition:transform .55s cubic-bezier(.3,.7,.3,1),opacity .15s .45s}
.toast{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:9px;z-index:30;animation:rise .25s;max-width:92vw}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:980px){
  .app{height:auto;min-height:0}
  header{flex-wrap:wrap;gap:6px 10px;position:sticky;top:0;z-index:10}
  .progress{order:3;flex-basis:100%}
  header h1{flex:1;font-size:15px}
  .main{display:flex;flex-direction:column}
  .work{display:contents}
  .mission,.zonewrap,.term,.panel{min-width:0;max-width:100%}
  .mission{order:2;border:0;border-block:1px solid var(--line);padding:12px 14px}
  .zonewrap{order:1;padding:8px}
  .bottom{display:contents}
  .term{order:3;margin:8px;height:290px}
  .panel{order:4;margin:0 8px 16px;min-height:220px}
  .scopes,.arrows{display:none}
  .zones{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
  .zone{height:124px;padding:4px 7px}
  .zone .sub{display:none}
  .sheet{grid-template-columns:1fr}
  .tin input{font-size:16px}
  .dialog{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>גיט ב-5 דקות</h1>
    <div class="progress"><div class="bar"><i id="bar"></i></div><span class="where" id="where"></span></div>
    <button class="hbtn" id="btnSheet">דף פקודות</button>
    <button class="hbtn" id="btnReset">מההתחלה</button>
  </header>
  <div class="main">
    <aside class="mission" id="mission" aria-live="polite"></aside>
    <section class="work">
      <div class="zonewrap">
        <div class="scopes"><span>💻 על המחשב שלכם</span><span>☁️ באינטרנט</span></div>
        <div class="zones">
          <div class="zone" id="z-wd" style="--c:var(--wd)"></div>
          <div class="arrows" dir="ltr"><div>add<b>←</b></div><div><b>→</b>restore</div></div>
          <div class="zone" id="z-stage" style="--c:var(--stage)"></div>
          <div class="arrows" dir="ltr"><div>commit<b>←</b></div></div>
          <div class="zone" id="z-repo" style="--c:var(--repo)"></div>
          <div class="arrows" dir="ltr"><div>push<b>←</b></div><div><b>→</b>pull</div></div>
          <div class="zone" id="z-remote" style="--c:var(--remote)"></div>
        </div>
      </div>
      <div class="bottom">
        <div class="term">
          <div class="tout" id="tout" role="log"></div>
          <form class="tin" id="tform" autocomplete="off">
            <label for="tinput" id="prompt"></label>
            <input id="tinput" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send" aria-label="טרמינל">
            <button type="submit" aria-label="הרצה">▶</button>
          </form>
        </div>
        <div class="panel">
          <div class="tabs" role="tablist">
            <button role="tab" id="tabGraph" aria-selected="true">היסטוריה (גרף)</button>
            <button role="tab" id="tabGit" aria-selected="false">בתוך <span dir="ltr">.git</span></button>
          </div>
          <div class="pbody" id="pbody"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
'use strict';
/* ---------- small DOM helpers ---------- */
const $ = id => document.getElementById(id);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) e.append(c);
  return e;
}

/* ---------- the simulated repository ---------- */
const START_FILE = 'גרגירי חומוס\nמלח\n';
const FILE = 'hummus.txt';
let S, seq, anims, failed, ran, selected = null;

function freshState() {
  seq = 0;
  S = {
    init: false, files: { [FILE]: START_FILE }, index: {}, commits: {},
    branches: {}, head: { branch: 'main' }, remote: null, remoteRefs: {},
    tracking: {}, merging: null, stash: [],
  };
}

const lines = t => { if (!t) return []; const l = t.split('\n'); if (l[l.length - 1] === '') l.pop(); return l; };
const unlines = l => l.length ? l.join('\n') + '\n' : '';
const headId = () => S.head.detached || S.branches[S.head.branch] || null;
const tree = id => id ? S.commits[id].tree : {};
const headTree = () => tree(headId());
const headLabel = () => S.head.branch || S.head.detached.slice(0, 7);

function hash(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16).padStart(8, '0').slice(0, 7);
}
function mkCommit(msg, parents, t, author = 'You') {
  const n = ++seq;
  const id = hash(n + msg + JSON.stringify(t) + parents.join());
  S.commits[id] = { id, n, msg, parents, tree: { ...t }, author, date: new Date() };
  return id;
}
function ancestors(id) {
  const seen = new Set(), st = id ? [id] : [];
  while (st.length) { const c = st.pop(); if (!seen.has(c)) { seen.add(c); st.push(...S.commits[c].parents); } }
  return seen;
}
const isAncestor = (a, b) => !!a && !!b && ancestors(b).has(a);
function mergeBase(a, b) {
  const A = ancestors(a); let best = null;
  for (const c of ancestors(b)) if (A.has(c) && (!best || S.commits[c].n > S.commits[best].n)) best = c;
  return best;
}
function setRef(id) { if (S.head.branch) S.branches[S.head.branch] = id; else S.head.detached = id; }

function ignored(path) {
  if (path === '.gitignore' || S.files['.gitignore'] === undefined) return false;
  return lines(S.files['.gitignore']).some(p => {
    p = p.trim(); if (!p || p[0] === '#') return false;
    return p[0] === '*' ? path.endsWith(p.slice(1)) : path === p || path === p.replace(/\/$/, '');
  });
}
function treeDiff(a, b) {
  return [...new Set([...Object.keys(a), ...Object.keys(b)])].sort().filter(p => a[p] !== b[p])
    .map(p => ({ p, kind: a[p] === undefined ? 'new file' : b[p] === undefined ? 'deleted' : 'modified' }));
}
function status() {
  const conflicts = S.merging ? S.merging.conflicts : [];
  const staged = treeDiff(headTree(), S.index).filter(d => !conflicts.includes(d.p));
  const unstaged = treeDiff(S.index, S.files).filter(d => S.index[d.p] !== undefined && !conflicts.includes(d.p));
  const untracked = Object.keys(S.files).filter(p => S.index[p] === undefined && !ignored(p) && !conflicts.includes(p)).sort();
  return { staged, unstaged, untracked, conflicts };
}

/* Line diff and three-way merge: enough diff3 that edits to different lines merge cleanly. */
function lcsPairs(a, b) {
  const t = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    t[i][j] = a[i] === b[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { out.push([i++, j++]); }
    else if (t[i + 1][j] >= t[i][j + 1]) i++; else j++;
  }
  return out;
}
function lineDiff(a, b) {
  const out = []; let i = 0, j = 0;
  for (const [x, y] of [...lcsPairs(a, b), [a.length, b.length]]) {
    while (i < x) out.push(['-', a[i++]]);
    while (j < y) out.push(['+', b[j++]]);
    if (x < a.length) out.push([' ', a[x]]);
    i = x + 1; j = y + 1;
  }
  return out;
}
function merge3Text(base, ours, theirs, oursName, theirsName) {
  const B = lines(base), O = lines(ours), T = lines(theirs);
  const mo = new Map(lcsPairs(B, O)), mt = new Map(lcsPairs(B, T));
  const out = []; let conflict = false, i = 0, j = 0, k = 0;
  const eq = (x, y) => x.join('\n') === y.join('\n');
  const chunk = (b, o, t) => {
    const cb = B.slice(i, b), co = O.slice(j, o), ct = T.slice(k, t);
    if (eq(co, cb)) out.push(...ct);
    else if (eq(ct, cb) || eq(co, ct)) out.push(...co);
    else { conflict = true; out.push('<<<<<<< ' + oursName, ...co, '=======', ...ct, '>>>>>>> ' + theirsName); }
  };
  for (let b = 0; b < B.length; b++) {
    if (mo.has(b) && mt.has(b)) {
      chunk(b, mo.get(b), mt.get(b));
      out.push(B[b]); i = b + 1; j = mo.get(b) + 1; k = mt.get(b) + 1;
    }
  }
  chunk(B.length, O.length, T.length);
  return { text: unlines(out), conflict };
}
function merge3Trees(base, ours, theirs, oursName, theirsName) {
  const res = {}, conflicts = [];
  for (const p of new Set([...Object.keys(base), ...Object.keys(ours), ...Object.keys(theirs)])) {
    const b = base[p], o = ours[p], t = theirs[p];
    if (o === t) { if (o !== undefined) res[p] = o; }
    else if (o === b) { if (t !== undefined) res[p] = t; }
    else if (t === b) { if (o !== undefined) res[p] = o; }
    else if (o === undefined || t === undefined) { res[p] = o ?? t; conflicts.push(p); }
    else {
      const m = merge3Text(b || '', o, t, oursName, theirsName);
      res[p] = m.text; if (m.conflict) conflicts.push(p);
    }
  }
  return { res, conflicts };
}
/* Replace the working files with a commit's tree, refusing like git when local edits would be lost. */
function checkoutTree(target) {
  const cur = headTree(), changed = treeDiff(cur, target).map(d => d.p);
  const block = changed.filter(p =>
    (S.files[p] !== cur[p] && S.files[p] !== target[p]) || (S.index[p] !== cur[p] && S.index[p] !== target[p]));
  if (block.length) {
    err('error: Your local changes to the following files would be overwritten:');
    block.forEach(p => out('        ' + p, 'r'));
    err('Please commit your changes or stash them before you switch branches.');
    tip('יש לכם שינויים שלא נשמרו, והמעבר היה דורס אותם. קודם commit (או git stash).');
    return false;
  }
  for (const p of changed) {
    if (target[p] === undefined) { delete S.files[p]; delete S.index[p]; }
    else { S.files[p] = target[p]; S.index[p] = target[p]; }
  }
  return true;
}
function resolveRev(r) {
  if (!r) return null;
  const m = r.match(/^(.*?)(~(\d*)|\^)$/);
  if (m) {

function resolveConflict(mode) {

  if (!re.test(S.files[FILE] || '')) { toast('אין קונפליקט בקובץ'); return; }
  editFile(t => t.replace(re, (_, o, th) => mode === 'ours' ? o : mode === 'theirs' ? th : o + th));
}

let stepI = 0, stepDone = false, usedActions = new Set(), showSelf = false;
function enterStep(i) {
  stepI = i; stepDone = false; ran = new Set(); usedActions = new Set(); showSelf = false;
  const s = STEPS[i];
  if (s) {
    if (s.tab) tab = s.tab;
    if (s.enter) s.enter();
  } else tab = 'graph';
  render();
  renderMission();
  checkStep();
  focusTerm();
}
function checkStep() {
  const s = STEPS[stepI];
  if (!s || stepDone || !s.check()) return;
  stepDone = true;
  renderMission();
  const m = $('mission');
  m.scrollTop = m.scrollHeight;
  if (innerWidth <= 980) m.querySelector('.done')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function next() { if (stepDone) enterStep(stepI + 1); }
function fillCmd(c) { const i = $('tinput'); i.value = c; i.focus(); }
function focusTerm() { if (matchMedia('(pointer:fine)').matches) $('tinput').focus(); }

function renderMission() {
  const m = $('mission'); m.textContent = '';
  const s = STEPS[stepI];
  document.querySelectorAll('.zone').forEach(z => z.classList.remove('focus'));
  $('bar').style.width = (Math.min(stepI + (stepDone ? 1 : 0), STEPS.length) / STEPS.length * 100) + '%';
  if (!s) { $('where').textContent = 'סיימתם!'; return renderFinish(m); }
  $('where').textContent = `פרק ${s.ch + 1} מתוך ${CHAPTERS.length} · צעד ${stepI + 1}/${STEPS.length}`;
  (s.focus || []).forEach(z => $('z-' + z).classList.add('focus'));
  m.append(el('div', { class: 'chapter', html: `פרק ${s.ch + 1}: ${CHAPTERS[s.ch]}` }));
  m.append(el('h2', { html: s.title }));
  m.append(el('p', { html: s.body }));
  if (s.actions) {
    const row = el('div', { class: 'actions' });
    s.actions.forEach((a, i) => {
      const b = el('button', { class: 'action', onclick: () => {
        if (a.once) usedActions.add(i);
        a.run();
        if (a.once) b.disabled = true;
        focusTerm();
      } }, a.label);
      if (usedActions.has(i)) b.disabled = true;
      row.append(b);
    });
    m.append(row);
  }
  const cmds = typeof s.cmds === 'function' ? s.cmds() : s.cmds;
  if (s.self && !showSelf && !stepDone) {
    m.append(el('button', { class: 'linkbtn', onclick: () => { showSelf = true; renderMission(); } }, 'תקועים? הראו לי את הפקודות'));
  } else {
    const box = el('div', { class: 'chips' });
    cmds.forEach(c => box.append(el('button', { class: 'chip', onclick: () => fillCmd(c) }, c)));
    m.append(box);
    if (stepI < 2) m.append(el('div', { class: 'chiphint', html: 'הקלידו בטרמינל (עדיף, ככה זוכרים), או לחצו על הפקודה כדי להעתיק אותה לשם, ואז Enter.' }));
  }
  if (stepDone) {
    const d = el('div', { class: 'done' });
    d.append(el('b', {}, '✓ '), el('span', { html: s.done }));
    d.append(el('button', { class: 'next', onclick: next }, stepI === STEPS.length - 1 ? 'סיום' : 'הבא'));
    if (matchMedia('(pointer:fine)').matches) d.append(el('div', { class: 'kbd', html: 'או Enter בטרמינל' }));
    m.append(d);
  }
}

const QUIZ = [
  { q: 'עשיתם commit בלי אינטרנט. איפה הוא נשמר?',
    a: ['בתיקייה \u200E.git\u200E על המחשב שלכם', 'ב-GitHub', 'הוא יישמר רק כשיחזור האינטרנט'], ok: 0,
    why: 'commit הוא מקומי לגמרי. רק push שולח לשרת.' },
  { q: 'שיניתם קובץ והרצתם commit בלי add. מה נשמר?',
    a: ['השינוי נשמר', 'השינוי לא נשמר: commit לוקח רק מה שב-staging', 'הקובץ נמחק'], ok: 1,
    why: 'לכן git status לפני commit עושה חיים קלים.' },
  { q: 'מה ההבדל בין Git ל-GitHub?',
    a: ['אותו דבר', 'Git הוא הכלי, GitHub הוא אתר שמחזיק עותקים', 'GitHub הוא הגרסה החדשה של Git'], ok: 1,
    why: 'Git עובד מצוין גם בלי GitHub. יש גם אתרים אחרים, כמו GitLab.' },
  { q: 'מה זה ענף, פיזית?',
    a: ['עותק של כל הקבצים', 'תיקייה נפרדת בדיסק', 'קובץ קטן עם hash של commit'], ok: 2,
    why: 'לכן ענפים זולים ומהירים. פותחים אחד לכל משימה.' },
  { q: 'git push נכשל עם rejected. מה עושים?',
    a: ['git pull, ואז שוב push', 'git push --force', 'מוחקים את התיקייה ומורידים מחדש'], ok: 0,
    why: 'בשרת יש commits שאין לכם. force היה דורס את העבודה של אחרים.' },
];
function renderFinish(m) {
  m.append(el('h2', { html: 'זהו, אתם יודעים גיט 🎉' }));
  m.append(el('p', { html: 'הטרמינל עדיין פתוח: משחקים חופשי. נסו ענף נוסף, <code>git revert</code>, <code>git stash</code>, או הכפתור <b>חבר דוחף שינוי</b> למעלה.' }));
  m.append(el('p', { html: '<b>חמש שאלות אחרונות:</b>' }));
  QUIZ.forEach(q => {
    const box = el('div', { class: 'q' });
    box.append(el('p', { html: q.q }));
    const btns = q.a.map((t, i) => el('button', { onclick: () => {
      btns.forEach((b, j) => { b.disabled = true; if (j === q.ok) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
      box.append(el('div', { class: 'why', html: q.why }));
    } }, t));
    btns.forEach(b => box.append(b));
    m.append(box);
  });
  m.append(el('button', { class: 'next', onclick: openSheet }, 'דף הפקודות לשמירה'));
}

/* ---------- dialogs ---------- */
function showIntro() {
  const ov = el('div', { class: 'overlay' },
    el('div', { class: 'dialog', html: `
      <h2>גיט הוא Save Game לתיקייה שלכם</h2>
      <ul>
        <li><b>כל שמירה (commit)</b> היא תמונה של כל הפרויקט, עם מי, מתי ולמה.</li>
        <li><b>אפשר לחזור</b> לכל שמירה, ולעבוד במקביל על כמה כיוונים בלי לסכן את מה שעובד.</li>
        <li><b>זה עובד בלי אינטרנט.</b> GitHub הוא רק אתר ששומר עוד עותק, כדי לעבוד עם אחרים.</li>
      </ul>
      <p>בחמש הדקות הקרובות נבנה יחד מתכון לחומוס. מקלידים פקודות אמיתיות, ורואים מה קורה לקבצים, ואיפה כל דבר נשמר.</p>
      <p class="note">זה סימולטור בתוך הדף: הפקודות כמו בגיט האמיתי, אבל שום דבר לא נוגע במחשב שלכם. אי אפשר לשבור כלום.</p>` }));
  const go = el('button', { class: 'primary', onclick: () => { ov.remove(); focusTerm(); } }, 'מתחילים');
  ov.firstChild.append(go);
  document.body.append(ov);
  go.focus();
}
function openSheet() {
  const table = (title, rows) => {
    const t = el('div'); t.append(el('h3', { html: title }));
    const tb = el('table');
    rows.forEach(([c, d]) => {
      const tr = el('tr'); const a = el('td'); a.textContent = c; const b = el('td'); b.textContent = d;
      tr.append(a, b); tb.append(tr);
    });
    t.append(tb); return t;
  };
  const sheet = el('div', { class: 'sheet' },
    table('מתחילים', [['git init', 'פרויקט חדש בתיקייה הזו'], ['git clone <url>', 'הורדת פרויקט קיים'], ['git config --global user.name "..."', 'השם שלכם (פעם אחת)'], ['git config --global user.email "..."', 'המייל שלכם (פעם אחת)']]),
    table('כל יום', [['git status', 'מה המצב'], ['git add <file>', 'לאזור ההכנה'], ['git add .', 'כל מה שהשתנה'], ['git commit -m "..."', 'שמירה'], ['git log --oneline', 'היסטוריה'], ['git diff', 'מה השתנה ועוד לא ב-add'], ['git diff --staged', 'מה ב-add ועוד לא נשמר']]),
    table('ענפים', [['git branch', 'רשימת ענפים'], ['git switch -c <name>', 'ענף חדש, ועוברים אליו'], ['git switch <name>', 'מעבר לענף'], ['git merge <name>', 'מיזוג לענף הנוכחי'], ['git branch -d <name>', 'מחיקת ענף שמוזג']]),
    table('עם אחרים', [['git remote add origin <url>', 'חיבור לשרת'], ['git push -u origin main', 'דחיפה ראשונה'], ['git push', 'שליחת commits'], ['git pull', 'הורדה ומיזוג'], ['git fetch', 'הורדה בלי מיזוג']]),
    table('ביטולים', [['git restore <file>', 'ביטול שינוי שלא נשמר (נמחק!)'], ['git restore --staged <file>', 'הוצאה מאזור ההכנה'], ['git revert <hash>', 'commit חדש שמבטל ישן (בטוח)'], ['git stash / git stash pop', 'החבאת שינויים לרגע, והחזרה'], ['git reset --hard <hash>', 'מחיקת עבודה וחזרה אחורה (מסוכן!)']]),
    table('איפה הכול נמצא', [['קבצים', 'תיקיית העבודה'], ['staging', '\u200E.git/index'], ['commits', '\u200E.git/objects'], ['ענפים', '\u200E.git/refs/heads'], ['איפה אני', '\u200E.git/HEAD'], ['כתובת השרת', '\u200E.git/config']]),
  );
  const notes = el('div', { html: `
    <h3>מה שונה במחשב אמיתי</h3>
    <ul class="note">
      <li>מתקינים מ-<code>git-scm.com</code>, ובפעם הראשונה מגדירים שם ומייל. בלי זה commit ייכשל.</li>
      <li>הענף הראשוני עשוי להיקרא <code>master</code>. <code>git init -b main</code> קובע <code>main</code>.</li>
      <li>לפני push צריך ליצור את הפרויקט באתר GitHub ולהתחבר. הסיסמה הרגילה לא עובדת שם: משתמשים ב-<code>gh auth login</code> או מפתח SSH.</li>
      <li>אם <code>git pull</code> מבקש לבחור איך למזג: <code>git config pull.rebase false</code> מתנהג כמו פה.</li>
      <li>קובץ <code>.gitignore</code> מונה מה לא לשמור בגיט. <b>סיסמאות ומפתחות לא נכנסים לגיט לעולם</b>: גם אחרי מחיקה הם נשארים בהיסטוריה.</li>
    </ul>` });
  const close = () => ov.remove();
  const ov = el('div', { class: 'overlay', onclick: e => { if (e.target === ov) close(); }, onkeydown: e => { if (e.key === 'Escape') close(); } },
    el('div', { class: 'dialog wide' }, el('h2', { html: 'דף פקודות' }), sheet, notes,
      el('button', { class: 'primary', onclick: close }, 'סגירה'),
      el('button', { class: 'ghost', onclick: () => print() }, 'הדפסה')));
  document.body.append(ov);
  ov.querySelector('.primary').focus();
}

/* ---------- wiring ---------- */
$('tform').addEventListener('submit', e => {
  e.preventDefault();
  const i = $('tinput'), line = i.value.trim();
  i.value = '';
  if (!line) { next(); return; }
  hist.push(line); histI = hist.length;
  runLine(line);
});
$('tinput').addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && histI > 0) { e.preventDefault(); e.target.value = hist[--histI]; }
  if (e.key === 'ArrowDown') { e.preventDefault(); histI = Math.min(hist.length, histI + 1); e.target.value = hist[histI] || ''; }
});
$('tabGraph').onclick = () => { tab = 'graph'; renderPanel(); };
$('tabGit').onclick = () => { tab = 'git'; renderPanel(); };
$('btnSheet').onclick = openSheet;
$('btnReset').onclick = () => { if (confirm('להתחיל מחדש? כל מה שעשיתם יימחק.')) start(); };
function start() {
  freshState(); selected = null; friendA = friendB = null; extraI = 0; tab = 'graph'; anims = [];
  $('tout').textContent = '';
  tip('זה הטרמינל. כותבים פה פקודות, כמו במחשב אמיתי. help מציג רשימה.');
  enterStep(0);
}
start();
showIntro();
</script>
